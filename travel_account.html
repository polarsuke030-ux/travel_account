<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>경비장 — 여행 경비 정산</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<style>
  :root{
    --bg:#F7F8FA;
    --surface:#FFFFFF;
    --ink:#191F28;
    --ink-2:#4E5968;
    --ink-3:#8B95A1;
    --line:#E5E8EB;
    --blue:#3182F6;
    --blue-dim:#EBF2FE;
    --red:#F04452;
  }
  *{ font-family:'Pretendard',-apple-system,BlinkMacSystemFont,'Malgun Gothic',sans-serif; }
  body{ background:var(--bg); color:var(--ink); -webkit-font-smoothing:antialiased; }
  ::-webkit-scrollbar{ width:8px; height:8px; }
  ::-webkit-scrollbar-thumb{ background:#D1D6DB; border-radius:8px; }
  .card{ background:var(--surface); border-radius:20px; }
  .soft-shadow{ box-shadow:0 2px 10px rgba(25,31,40,0.04),0 1px 2px rgba(25,31,40,0.03); }
  .tap{ transition:transform .12s ease, box-shadow .12s ease, background-color .12s ease; }
  .tap:active{ transform:scale(0.985); }
  .fade-in{ animation:fadeIn .25s ease both; }
  @keyframes fadeIn{ from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:translateY(0);} }
  input,select,textarea{ outline:none; }
  input:focus,select:focus,textarea:focus{ box-shadow:0 0 0 3px var(--blue-dim); border-color:var(--blue) !important; }
  ::placeholder{ color:#B0B8C1; }
  .bar-track{ background:#EEF1F4; border-radius:999px; overflow:hidden; }
  .bar-fill{ border-radius:999px; transition:width .4s ease; }
  @media (prefers-reduced-motion: reduce){ .fade-in,.tap,.bar-fill{ animation:none !important; transition:none !important; } }
</style>
</head>
<body class="min-h-screen">

<div id="app" class="max-w-3xl mx-auto px-4 sm:px-6 pb-24"></div>
<div id="modal-root"></div>

<script>
/* =========================================================
   상태 & 저장소  (localStorage만 사용 — 서버 없이 완전히 클라이언트에서 동작)
========================================================= */
const STORAGE_KEY = 'gyeongbijang_trips_v3';

const CATEGORY_META = {
  '숙박':      { color:'#15499E', label:'숙박' },
  '항공권':    { color:'#1B64DA', label:'항공권' },
  '대중교통':  { color:'#3182F6', label:'대중교통' },
  '관광':      { color:'#5B9DF9', label:'관광' },
  '쇼핑':      { color:'#8FBCFB', label:'쇼핑' },
  '간식':      { color:'#B9D6FD', label:'간식' },
  '식비':      { color:'#DCE9FE', label:'식비' },
  '기타':      { color:'#ADB5BD', label:'기타' },
};
const CATEGORY_LIST = Object.keys(CATEGORY_META);
const PAYMENT_LIST = ['카드', '현금', '스이카', '기타'];

let state = {
  trips: [],
  currentTripId: null,
  editingTxnId: null,
  showInputPanel: false,
  showAddForm: false,
  currencyView: 'LOCAL', // 'LOCAL' | 'KRW' — 화면 전환용, 여행마다 진입 시 초기화
  expandedDates: new Set(), // 펼쳐진 날짜 그룹의 key 목록 — 기본은 전부 접힘
};

function loadTrips(){
  try{ state.trips = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]'); }
  catch(e){ console.error('저장된 데이터를 불러오지 못했습니다', e); state.trips = []; }
}
function saveTrips(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(state.trips)); }
function uid(p='id'){ return p+'_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,8); }
function escRe(s){ return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }

/* =========================================================
   AI 스마트 분류 규칙 (8개 카테고리)
========================================================= */
const CATEGORY_RULES = [
  { cat:'숙박',     kws:['숙박','호텔','리조트','펜션','게스트하우스','캡슐호텔','료칸','민박','에어비앤비','도미토리'] },
  { cat:'항공권',   kws:['항공권','항공사','비행기','국제선','국내선','대한항공','아시아나','진에어','제주항공','티웨이','에어부산','피치항공','peach','klm','jal','이티켓','e-ticket','보딩'] },
  { cat:'대중교통', kws:['지하철','버스','기차','ktx','srt','페리','택시','렌터카','렌트카','주유','톨게이트','하이패스','우버','그랩','카카오t','차량공유','교통카드','스이카','jr','신칸센','왕복','편도','환승','정기권'] },
  { cat:'관광',     kws:['입장료','박물관','미술관','유적지','투어','액티비티','스노클링','스키장','테마파크','공연','콘서트','전망대','온천','대욕장','목욕탕','신사','사찰','절','유원지','케이블카','크루즈','불상'] },
  { cat:'기타',     kws:['여행자보험','보험','환전','수수료','유심','esim','e심','심카드','라운지','비자','팁','atm','출금','병원','약국','파스','마운자로','압박스타킹','발패치','유산균','영양제'] },
  { cat:'쇼핑',     kws:['기념품','소버니어','특산품','선물','면세점','의류','속옷','운동복','화장품','소품','잡화','다이소','유니클로','파타고니아','노스페이스','저널스탠다드','3coins','돈키호테','백화점','미츠코시','다이마루','탑투더힐','파르코','아울렛','무인양품','올리브영'] },
  { cat:'간식',     kws:['커피','카페','라떼','베이커리','빵','디저트','편의점','로손','세이코마트','세븐일레븐','아이스크림','도넛','초콜릿','과자','야식','타이야끼','붕어빵','크레페','마카롱','도라야끼','카스테라','동구리','후지야','분메이도','롯카테이'] },
  { cat:'식비',     kws:['아침','점심','저녁','맛집','레스토랑','식당','정식','라멘','스시','우동','소바','카레','국수','덮밥','규동','마트','coop','코업','다이이치','다이치','새우마요','타코야끼','샌드위치','에비소바','이온몰','슈퍼','우유','샐러드'] },
];
function categorize(desc){
  const lower = desc.toLowerCase();
  for(const rule of CATEGORY_RULES){
    for(const kw of rule.kws){ if(lower.includes(kw.toLowerCase())) return rule.cat; }
  }
  return '기타';
}

/* =========================================================
   스마트 파서 (원화·현지통화 혼용 자동 분리)
========================================================= */
function makeTxn(currentDate, tripYear, amount, currency, rawDesc, uncertain){
  let desc = rawDesc.trim();
  let payment = '카드';
  if(/\(현금\)/.test(desc)){ payment='현금'; desc = desc.replace(/\(현금\)/,'').trim(); }
  else if(/스이카/.test(desc) && !/충전/.test(desc)){ payment='스이카'; }
  const category = categorize(desc);
  let dateStr = '';
  if(currentDate){
    dateStr = `${tripYear}-${String(currentDate.month).padStart(2,'0')}-${String(currentDate.day).padStart(2,'0')}`;
  }
  return { id: uid('txn'), date:dateStr, dow: currentDate?currentDate.dow:'', category, payment, description: desc || '(내용 미상)', amount, currency, uncertain: !!uncertain };
}

function smartParse(text, tripYear, currencyUnit){
  const lines = text.split(/\r?\n/);
  const transactions = [], unparsed = [];
  let currentDate = null, suicaBalance = null;

  const balMatch = text.match(/스이카\s*잔액\s*[:：]?\s*([\d,]+)\s*(원|엔)?/);
  if(balMatch) suicaBalance = parseInt(balMatch[1].replace(/,/g,''));

  const dateLineRe = /^(\d{1,2})\/(\d{1,2})\s*([월화수목금토일])?\s*([\d,]+)?\s*(원|엔)?\s*$/;
  const txnRe = new RegExp(`^([\\d,]+)\\s*(${escRe(currencyUnit || '엔')}|원)?\\s*(\\?)?\\s+(.+)$`);

  for(const rawLine of lines){
    let line = rawLine.trim().replace(/^[•\-\*]\s*/, '');
    if(!line) continue;
    if(/스이카\s*잔액/.test(line)) continue;
    if(/여행\s*경비\s*정산/.test(line) && line.length < 20) continue;

    let m;
    if((m = line.match(dateLineRe))){
      currentDate = { month: parseInt(m[1]), day: parseInt(m[2]), dow: m[3] || '' };
      continue;
    }
    if((m = line.match(txnRe))){
      const amount = parseInt(m[1].replace(/,/g, ''));
      if(isNaN(amount)){ unparsed.push(line); continue; }
      const currency = (m[2] === '원') ? 'KRW' : 'LOCAL';
      transactions.push(makeTxn(currentDate, tripYear, amount, currency, m[4], !!m[3]));
      continue;
    }
    unparsed.push(line);
  }
  return { transactions, unparsed, suicaBalance };
}

/* =========================================================
   유틸
========================================================= */
function fmt(n, symbol){ return (Math.round(n)||0).toLocaleString('ko-KR') + symbol; }
function findTrip(id){ return state.trips.find(t => t.id === id); }
function fmtDateHeader(dateStr, dow){
  if(!dateStr) return '날짜 미상';
  const [,m,d] = dateStr.split('-');
  return `${parseInt(m)}/${parseInt(d)}${dow ? ' ('+dow+')' : ''}`;
}
function escapeHtml(s){ return (s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function rate(trip){ return parseFloat(trip.exchangeRate) || 0; }

/* 거래 1건의 표시 금액/단위를 현재 통화보기(state.currencyView) 기준으로 계산 */
function displayTxn(trip, t){
  if(state.currencyView === 'KRW'){
    const val = t.currency === 'KRW' ? t.amount : t.amount * rate(trip);
    return { value: val, symbol: '원' };
  }
  return { value: t.amount, symbol: t.currency === 'KRW' ? '원' : trip.currencyUnit };
}

/* =========================================================
   렌더 진입점
========================================================= */
function render(){
  const app = document.getElementById('app');
  if(state.currentTripId){
    const trip = findTrip(state.currentTripId);
    if(!trip){ state.currentTripId = null; return render(); }
    app.innerHTML = renderTripDetail(trip);
  } else {
    app.innerHTML = renderHome();
  }
}

/* =========================================================
   홈 화면
========================================================= */
function renderHome(){
  const trips = [...state.trips].sort((a,b) => (b.createdAt||0) - (a.createdAt||0));
  const tripCards = trips.map(t => {
    const localTotal = t.transactions.filter(x=>x.currency!=='KRW').reduce((s,x)=>s+x.amount,0);
    const krwTotal = t.transactions.filter(x=>x.currency==='KRW').reduce((s,x)=>s+x.amount,0);
    const sub = [t.yearMonth, t.destination].filter(Boolean).join(' · ');
    return `
    <div class="card soft-shadow tap cursor-pointer relative group p-5 fade-in" onclick="openTrip('${t.id}')">
      <button class="absolute top-4 right-4 w-8 h-8 rounded-full flex items-center justify-center text-[#B0B8C1] hover:bg-[#F5F6F8] hover:text-[var(--red)] tap"
        onclick="event.stopPropagation(); deleteTrip('${t.id}')" title="여행 삭제">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M3 6h18M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2m3 0l-1 14a2 2 0 01-2 2H7a2 2 0 01-2-2L4 6h16z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <p class="text-[13px] text-[var(--ink-3)] mb-1">${sub || '여행'}</p>
      <h3 class="text-[19px] font-bold mb-4 pr-8 leading-snug">${escapeHtml(t.name)}</h3>
      <div class="flex items-end justify-between">
        <div>
          <p class="text-[12px] text-[var(--ink-3)] mb-0.5">총 지출</p>
          <p class="text-[20px] font-bold text-[var(--blue)]">${fmt(localTotal, t.currencyUnit)}</p>
          ${krwTotal>0 ? `<p class="text-[12px] text-[var(--ink-3)] mt-0.5">원화 결제 ${fmt(krwTotal,'원')}</p>` : ''}
        </div>
        <p class="text-[12px] text-[var(--ink-3)]">${t.transactions.length}건</p>
      </div>
    </div>`;
  }).join('');

  const totalTrips = trips.length;
  const totalTxns = trips.reduce((s,t) => s + t.transactions.length, 0);

  return `
  <div class="pt-8 pb-6 fade-in">
    <div class="rounded-[28px] p-6 sm:p-7 mb-6" style="background:linear-gradient(135deg,#3182F6,#1B64DA);">
      <h1 class="text-[24px] font-bold text-white mb-1.5">내 여행</h1>
      <p class="text-[14px] text-white/80">${totalTrips > 0 ? `지금까지 <span class="font-semibold text-white">${totalTrips}개</span>의 여행, <span class="font-semibold text-white">${totalTxns}건</span>의 지출을 기록했어요` : '첫 여행을 만들고 지출을 기록해보세요'}</p>
    </div>
  </div>
  <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 pb-10">
    <div class="card tap cursor-pointer border-2 border-dashed border-[#C7D2E0] hover:border-[var(--blue)] p-5 flex flex-col items-center justify-center text-center min-h-[168px] fade-in"
      onclick="openCreateModal()">
      <div class="w-11 h-11 rounded-full bg-[var(--blue-dim)] flex items-center justify-center mb-3">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="#3182F6" stroke-width="2.4" stroke-linecap="round"/></svg>
      </div>
      <p class="text-[15px] font-semibold">새 여행 추가하기</p>
      <p class="text-[13px] text-[var(--ink-3)] mt-1">경비 내역을 붙여넣으면 자동 정리돼요</p>
    </div>
    ${tripCards}
  </div>
  ${trips.length===0 ? `<p class="text-center text-[13px] text-[var(--ink-3)] pb-10">아직 등록된 여행이 없어요. 첫 여행을 만들어보세요.</p>` : ''}
  `;
}

/* =========================================================
   여행 생성 모달
========================================================= */
let createMode = 'combo';
function openCreateModal(){ createMode='combo'; document.getElementById('modal-root').innerHTML = renderCreateModal(); }
function closeModal(){ document.getElementById('modal-root').innerHTML = ''; }
function setCreateMode(mode){ createMode=mode; document.getElementById('modal-root').innerHTML = renderCreateModal(); }
function updateCurrencyHint(){
  const unit = (document.getElementById('input-currency')||{}).value || '엔';
  const hint = document.getElementById('currency-hint');
  if(hint) hint.textContent = `1${unit || '단위'}당 몇 원인가요?`;
}

function renderCreateModal(){
  const today = new Date();
  const ym = `${today.getFullYear()}.${String(today.getMonth()+1).padStart(2,'0')}`;
  return `
  <div class="fixed inset-0 bg-black/40 flex items-center justify-center z-50 px-4 fade-in overflow-y-auto py-8" onclick="if(event.target===this) closeModal()">
    <div class="card w-full max-w-[420px] p-6 soft-shadow my-auto">
      <h2 class="text-[18px] font-bold mb-5">새 여행 만들기</h2>
      <div class="flex gap-2 mb-5 bg-[var(--bg)] p-1 rounded-full">
        <button class="flex-1 py-2 rounded-full text-[13px] font-medium ${createMode==='combo' ? 'bg-white shadow-sm text-[var(--blue)]' : 'text-[var(--ink-3)]'}" onclick="setCreateMode('combo')">연월 + 여행지</button>
        <button class="flex-1 py-2 rounded-full text-[13px] font-medium ${createMode==='custom' ? 'bg-white shadow-sm text-[var(--blue)]' : 'text-[var(--ink-3)]'}" onclick="setCreateMode('custom')">이름 직접 입력</button>
      </div>
      ${createMode==='combo' ? `
        <label class="block text-[13px] text-[var(--ink-2)] mb-1.5">연.월</label>
        <input id="input-yearmonth" type="text" value="${ym}" class="w-full border border-[var(--line)] rounded-2xl px-4 py-3 text-[15px] mb-4" />
        <label class="block text-[13px] text-[var(--ink-2)] mb-1.5">여행지</label>
        <input id="input-destination" type="text" placeholder="예: 삿포로" class="w-full border border-[var(--line)] rounded-2xl px-4 py-3 text-[15px] mb-4" />
      ` : `
        <label class="block text-[13px] text-[var(--ink-2)] mb-1.5">여행 이름</label>
        <input id="input-customname" type="text" placeholder="예: 승혜의 홋카이도 워케이션" class="w-full border border-[var(--line)] rounded-2xl px-4 py-3 text-[15px] mb-4" />
      `}
      <div class="grid grid-cols-2 gap-3 mb-1">
        <div>
          <label class="block text-[13px] text-[var(--ink-2)] mb-1.5">현지통화 단위</label>
          <input id="input-currency" type="text" placeholder="예: 엔" value="엔" oninput="updateCurrencyHint()" class="w-full border border-[var(--line)] rounded-2xl px-4 py-3 text-[15px]" />
        </div>
        <div>
          <label class="block text-[13px] text-[var(--ink-2)] mb-1.5">기준 환율 (원)</label>
          <input id="input-rate" type="number" step="0.01" placeholder="예: 910" class="w-full border border-[var(--line)] rounded-2xl px-4 py-3 text-[15px]" />
        </div>
      </div>
      <p id="currency-hint" class="text-[12px] text-[var(--ink-3)] mb-1">1엔당 몇 원인가요?</p>
      <p class="text-[12px] text-[var(--ink-3)] mb-3">단위가 없는 금액은 현지통화로, "원"이 붙은 금액은 원화로 자동 인식돼요. 환율은 원화 환산 보기에 사용돼요.</p>
      <p id="create-error" class="text-[12px] text-[var(--red)] h-4"></p>
      <div class="flex gap-2 mt-2">
        <button class="flex-1 py-3 rounded-2xl text-[15px] font-semibold text-[var(--ink-2)] bg-[var(--bg)] tap" onclick="closeModal()">취소</button>
        <button class="flex-1 py-3 rounded-2xl text-[15px] font-semibold text-white bg-[var(--blue)] tap" onclick="submitCreateTrip()">만들기</button>
      </div>
    </div>
  </div>`;
}

function submitCreateTrip(){
  let name='', yearMonth='', destination='';
  if(createMode==='combo'){
    yearMonth = document.getElementById('input-yearmonth').value.trim();
    destination = document.getElementById('input-destination').value.trim();
    if(!destination){ document.getElementById('create-error').textContent = '여행지를 입력해주세요.'; return; }
    name = [yearMonth, destination].filter(Boolean).join(' ');
  } else {
    name = document.getElementById('input-customname').value.trim();
    if(!name){ document.getElementById('create-error').textContent = '여행 이름을 입력해주세요.'; return; }
  }
  const currencyUnit = document.getElementById('input-currency').value.trim() || '엔';
  const exchangeRate = parseFloat(document.getElementById('input-rate').value) || 0;
  const yearMatch = yearMonth.match(/(\d{4})/);
  const trip = {
    id: uid('trip'), name, yearMonth, destination,
    tripYear: yearMatch ? parseInt(yearMatch[1]) : new Date().getFullYear(),
    currencyUnit, exchangeRate,
    createdAt: Date.now(),
    suicaBalance: null,
    rawTextDraft: '',
    transactions: [],
  };
  state.trips.push(trip);
  saveTrips();
  closeModal();
  state.currentTripId = trip.id;
  state.currencyView = 'LOCAL';
  state.showInputPanel = true;
  render();
}

function deleteTrip(id){
  const trip = findTrip(id);
  if(!trip) return;
  if(!confirm(`'${trip.name}' 여행을 삭제할까요?\n삭제된 데이터는 복구할 수 없어요.`)) return;
  state.trips = state.trips.filter(t => t.id !== id);
  saveTrips();
  render();
}

function openTrip(id){
  state.currentTripId = id; state.editingTxnId = null; state.showInputPanel = false; state.showAddForm = false; state.currencyView = 'LOCAL';
  state.expandedDates = new Set();
  render();
}
function toggleDateGroup(key){
  if(state.expandedDates.has(key)) state.expandedDates.delete(key);
  else state.expandedDates.add(key);
  render();
}
function backToHome(){ state.currentTripId = null; render(); }

    <div class="card w-full max-w-[380px] p-6 soft-shadow">

      <div class="grid grid-cols-2 gap-3 mb-1">
        <div>
          <label class="block text-[13px] text-[var(--ink-2)] mb-1.5">현지통화 단위</label>

        </div>
      </div>
      <p class="text-[12px] text-[var(--ink-3)] mb-4">현지통화 1단위가 몇 원인지 입력하면, 원화 환산 보기에 바로 반영돼요.</p>
      <div class="flex gap-2">
        <button class="flex-1 py-3 rounded-2xl text-[15px] font-semibold text-[var(--ink-2)] bg-[var(--bg)] tap" onclick="closeModal()">취소</button>
        <button class="flex-1 py-3 rounded-2xl text-[15px] font-semibold text-white bg-[var(--blue)] tap" onclick="saveSettings('${tripId}')">저장</button>
      </div>
    </div>
  </div>`;
}
function saveSettings(tripId){
  const trip = findTrip(tripId);
  const name = document.getElementById('set-name').value.trim();
  const currencyUnit = document.getElementById('set-currency').value.trim();
  const exchangeRate = parseFloat(document.getElementById('set-rate').value) || 0;
  if(name) trip.name = name;
  if(currencyUnit) trip.currencyUnit = currencyUnit;
  trip.exchangeRate = exchangeRate;
  saveTrips();
  closeModal();
  render();
}

/* =========================================================

  return `

  if(view === 'KRW'){

    if(!rate(trip)){

  render();
}

          <button class="px-3.5 py-1.5 rounded-full tap ${state.currencyView==='KRW' ? 'bg-[var(--blue)] text-white' : 'text-[var(--ink-3)]'}" onclick="setCurrencyView('KRW')">원화(KRW)</button>

function toggleInputPanel(){ state.showInputPanel = !state.showInputPanel; render(); }

function renderInputPanel(trip){
  if(!state.showInputPanel) return '';
  return `
  <div class="card soft-shadow p-5 mb-5 fade-in">
    <h3 class="text-[15px] font-bold mb-1">경비 내역 스마트 파싱</h3>
    <p class="text-[13px] text-[var(--ink-3)] mb-3">아이폰 메모 내용을 그대로 붙여넣거나 .txt 파일을 올려주세요. "12,078원"처럼 원화가 섞여 있어도 자동으로 구분해요. (기본 통화: ${escapeHtml(trip.currencyUnit)})</p>
    <textarea id="paste-textarea" rows="7" placeholder="예)&#10;8/26 수&#10;61,600엔 캡슐호텔 숙박비&#10;12,078원 유심 결제&#10;500 자판기 음료" class="w-full border border-[var(--line)] rounded-2xl px-4 py-3 text-[14px] leading-relaxed mb-3 resize-none">${escapeHtml(trip.rawTextDraft||'')}</textarea>
    <div class="flex flex-wrap items-center gap-2">
      <label class="px-4 py-2.5 rounded-2xl text-[13px] font-medium bg-[var(--bg)] text-[var(--ink-2)] tap cursor-pointer">
        .txt 파일 불러오기
        <input type="file" accept=".txt" class="hidden" onchange="handleFileUpload(event)" />
      </label>
      <button class="px-4 py-2.5 rounded-2xl text-[13px] font-semibold bg-[var(--blue)] text-white tap" onclick="runSmartParse('${trip.id}')">스마트 파싱하기</button>
    </div>
  </div>`;
}

function handleFileUpload(evt){
  const file = evt.target.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = e => { document.getElementById('paste-textarea').value = e.target.result; };
  reader.readAsText(file, 'UTF-8');
}

function runSmartParse(tripId){
  const trip = findTrip(tripId);
  const text = document.getElementById('paste-textarea').value;
  if(!text.trim()){ alertBar('붙여넣을 내용이 없어요.'); return; }
  const { transactions, unparsed, suicaBalance } = smartParse(text, trip.tripYear || new Date().getFullYear(), trip.currencyUnit);
  trip.transactions = trip.transactions.concat(transactions);
  if(suicaBalance !== null) trip.suicaBalance = suicaBalance;
  trip.rawTextDraft = '';
  saveTrips();
  state.showInputPanel = false;
  render();
  alertBar(`${transactions.length}건 인식 완료` + (unparsed.length ? ` · ${unparsed.length}줄은 인식하지 못했어요` : ''));
  if(unparsed.length) console.warn('인식하지 못한 줄:', unparsed);
}

function alertBar(msg){
  const bar = document.createElement('div');
  bar.className = 'fixed bottom-5 left-1/2 -translate-x-1/2 bg-[#191F28] text-white text-[13px] px-5 py-3 rounded-full soft-shadow z-50 fade-in';
  bar.textContent = msg;
  document.body.appendChild(bar);
  setTimeout(() => bar.remove(), 3500);
}

/* ---------- 요약 카드: 총지출 + 카테고리 비중 (가독성 개편) ---------- */
function renderSummary(trip){
  const krwView = state.currencyView === 'KRW';
  const localTxns = trip.transactions.filter(t => t.currency !== 'KRW');
  const krwTxns = trip.transactions.filter(t => t.currency === 'KRW');

  let grandTotal, unitSymbol, byCategory, byPayment;

  if(krwView){
    unitSymbol = '원';
    grandTotal = trip.transactions.reduce((s,t) => s + displayTxn(trip,t).value, 0);
    byCategory = {}; CATEGORY_LIST.forEach(c => byCategory[c]=0);
    trip.transactions.forEach(t => byCategory[t.category] += displayTxn(trip,t).value);
    byPayment = {}; PAYMENT_LIST.forEach(p => byPayment[p]=0);
    trip.transactions.forEach(t => byPayment[t.payment] += displayTxn(trip,t).value);
  } else {
    unitSymbol = trip.currencyUnit;
    grandTotal = localTxns.reduce((s,t)=>s+t.amount,0);
    byCategory = {}; CATEGORY_LIST.forEach(c => byCategory[c]=0);
    localTxns.forEach(t => byCategory[t.category] += t.amount);
    byPayment = {}; PAYMENT_LIST.forEach(p => byPayment[p]=0);
    localTxns.forEach(t => byPayment[t.payment] += t.amount);
  }

  const paymentLine = PAYMENT_LIST.filter(p => byPayment[p]>0).map(p => `${p} ${fmt(byPayment[p], unitSymbol)}`).join('   ·   ');

  const catRows = CATEGORY_LIST
    .map(c => ({ c, v: byCategory[c] }))
    .filter(x => x.v > 0)
    .sort((a,b) => b.v - a.v)
    .map(({c,v}) => {
      const pct = grandTotal > 0 ? Math.round(v/grandTotal*100) : 0;
      return `
      <div>
        <div class="flex items-center justify-between mb-1.5">
          <div class="flex items-center gap-2">
            <span class="w-2 h-2 rounded-full shrink-0" style="background:${CATEGORY_META[c].color}"></span>
            <span class="text-[13px] font-medium text-[var(--ink)]">${CATEGORY_META[c].label}</span>
          </div>
          <span class="text-[13px] font-semibold">${fmt(v, unitSymbol)}</span>
        </div>
        <div class="flex items-center gap-2.5">
          <div class="flex-1 bar-track h-1.5"><div class="bar-fill h-1.5" style="width:${pct}%; background:${CATEGORY_META[c].color}"></div></div>
          <span class="text-[11px] text-[var(--ink-3)] w-8 text-right shrink-0">${pct}%</span>
        </div>
      </div>`;
    }).join('');

  const suicaLine = trip.suicaBalance !== null
    ? `<p class="text-[12px] text-[var(--ink-3)] mt-2">스이카 초기 잔액 ${fmt(trip.suicaBalance, trip.currencyUnit)}</p>` : '';

  const krwSeparateBlock = (!krwView && krwTxns.length > 0) ? (() => {
    const krwTotal = krwTxns.reduce((s,t)=>s+t.amount,0);
    const byCatKrw = {};
    krwTxns.forEach(t => byCatKrw[t.category] = (byCatKrw[t.category]||0)+t.amount);
    const rows = Object.entries(byCatKrw).sort((a,b)=>b[1]-a[1]).map(([c,v]) => `
      <div class="flex items-center justify-between py-1.5">
        <span class="text-[13px] text-[var(--ink-2)] flex items-center gap-2">
          <span class="w-1.5 h-1.5 rounded-full inline-block" style="background:${CATEGORY_META[c]?.color||'#ADB5BD'}"></span>
          ${CATEGORY_META[c]?.label||c}
        </span>
        <span class="text-[13px] font-medium">${fmt(v,'원')}</span>
      </div>`).join('');
    return `
    <div class="card soft-shadow p-5 mt-4 fade-in">
      <div class="flex items-baseline justify-between mb-2">
        <h3 class="text-[13px] font-semibold text-[var(--ink-2)]">원화 결제 내역 <span class="text-[var(--ink-3)] font-normal">(원화 보기로 전환하면 합산돼요)</span></h3>
        <p class="text-[16px] font-bold">${fmt(krwTotal,'원')}</p>
      </div>
      ${rows}
    </div>`;
  })() : '';

  return `
  <div class="card soft-shadow p-5 sm:p-6 mb-5 fade-in">
    <p class="text-[13px] text-[var(--ink-3)] mb-1">총 지출${krwView ? '' : ` (${escapeHtml(trip.currencyUnit)})`}</p>
    <p class="text-[32px] font-bold text-[var(--blue)] mb-1.5 tracking-tight">${fmt(grandTotal, unitSymbol)}</p>
    ${paymentLine ? `<p class="text-[12px] text-[var(--ink-3)]">${paymentLine}</p>` : ''}
    ${suicaLine}
    ${catRows ? `<div class="mt-4 pt-4 border-t border-[var(--line)] space-y-3.5">${catRows}</div>` : ''}
  </div>
  ${krwSeparateBlock}
  `;
}

/* ---------- 거래 내역: 날짜순 리스트만 ---------- */
function renderTransactionList(trip){
  const txns = trip.transactions.slice().sort((a,b) => (a.date||'').localeCompare(b.date||''));
  const groups = {};
  txns.forEach(t => { const key = t.date || '__nodate__'; (groups[key] = groups[key]||[]).push(t); });
  const dateKeys = Object.keys(groups).sort();

  const groupHtml = dateKeys.map(key => {
    const items = groups[key];
    const dow = items[0].dow;
    let totalLabel;
    if(state.currencyView === 'KRW'){
      const t = items.reduce((s,x) => s + displayTxn(trip,x).value, 0);
      totalLabel = fmt(t, '원');
    } else {
      const localTotal = items.filter(t=>t.currency!=='KRW').reduce((s,t)=>s+t.amount,0);
      const krwTotal = items.filter(t=>t.currency==='KRW').reduce((s,t)=>s+t.amount,0);
      totalLabel = [ localTotal ? fmt(localTotal, trip.currencyUnit) : '', krwTotal ? fmt(krwTotal, '원') : '' ].filter(Boolean).join(' + ');
    }
    const rows = items.map(t => renderTxnRow(trip, t)).join('');
    const isOpen = state.expandedDates.has(key);
    const dateLabel = key==='__nodate__' ? '날짜 미상' : fmtDateHeader(key, dow);
    return `
    <div class="mb-2.5">
      <button class="w-full card soft-shadow tap flex items-center justify-between px-4 py-3.5" onclick="toggleDateGroup('${key}')">
        <div class="flex items-center gap-2">
          <svg class="transition-transform duration-150 ${isOpen ? 'rotate-90' : ''}" width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M9 6l6 6-6 6" stroke="#8B95A1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span class="text-[15px] font-bold text-[var(--ink)]">${dateLabel}</span>
          <span class="text-[12px] text-[var(--ink-3)]">${items.length}건</span>
        </div>
        <span class="text-[17px] font-bold text-[var(--blue)]">${totalLabel}</span>
      </button>
      ${isOpen ? `<div class="card soft-shadow divide-y divide-[var(--line)] overflow-hidden mt-1.5 fade-in">${rows}</div>` : ''}
    </div>`;
  }).join('');

  return `
  <div class="flex items-center justify-between mb-3 mt-2">
    <h3 class="text-[16px] font-bold">거래 내역 <span class="text-[var(--ink-3)] font-normal text-[13px]">${trip.transactions.length}건</span></h3>
    <button class="px-3 py-2 rounded-full text-[13px] font-medium text-white bg-[var(--blue)] tap" onclick="toggleAddForm()">${state.showAddForm ? '닫기' : '+ 거래 추가'}</button>
  </div>
  ${state.showAddForm ? renderAddForm(trip) : ''}
  ${dateKeys.length ? groupHtml : `<div class="card soft-shadow p-10 text-center fade-in">
      <p class="text-[14px] text-[var(--ink-3)]">아직 등록된 거래가 없어요.</p>
      <p class="text-[13px] text-[var(--ink-3)] mt-1">위의 '경비 입력'에서 내역을 붙여넣어 보세요.</p>
    </div>`}
  `;
}

function toggleAddForm(){ state.showAddForm = !state.showAddForm; render(); }

function renderAddForm(trip){
  return `
  <div class="card soft-shadow p-4 mb-4 fade-in">
    <div class="grid grid-cols-2 sm:grid-cols-6 gap-2 mb-2">
      <input id="add-date" type="date" class="col-span-2 sm:col-span-2 border border-[var(--line)] rounded-xl px-3 py-2 text-[13px]" />
      <input id="add-desc" type="text" placeholder="사용처 / 내용" class="col-span-2 sm:col-span-2 border border-[var(--line)] rounded-xl px-3 py-2 text-[13px]" />
      <input id="add-amount" type="number" placeholder="금액" class="col-span-1 border border-[var(--line)] rounded-xl px-3 py-2 text-[13px]" />
      <select id="add-currency" class="col-span-1 border border-[var(--line)] rounded-xl px-2 py-2 text-[13px]">
        <option value="LOCAL">${escapeHtml(trip.currencyUnit)}</option>
        <option value="KRW">원</option>
      </select>
    </div>
    <div class="flex items-center gap-2 flex-wrap">
      <select id="add-category" class="border border-[var(--line)] rounded-xl px-2 py-2 text-[13px]">
        ${CATEGORY_LIST.map(c => `<option value="${c}">${CATEGORY_META[c].label}</option>`).join('')}
      </select>
      <select id="add-payment" class="border border-[var(--line)] rounded-xl px-2 py-2 text-[13px]">
        ${PAYMENT_LIST.map(p => `<option value="${p}">${p}</option>`).join('')}
      </select>
      <button class="ml-auto px-4 py-2 rounded-xl text-[13px] font-semibold text-white bg-[var(--blue)] tap" onclick="submitAddTxn('${trip.id}')">추가</button>
    </div>
  </div>`;

function submitAddTxn(tripId){
  const trip = findTrip(tripId);
  const date = document.getElementById('add-date').value;
  const desc = document.getElementById('add-desc').value.trim();
  const amount = parseInt(document.getElementById('add-amount').value);
  const currency = document.getElementById('add-currency').value;
  const category = document.getElementById('add-category').value;
  const payment = document.getElementById('add-payment').value;
  if(!desc || isNaN(amount)){ alertBar('내용과 금액을 입력해주세요.'); return; }
  trip.transactions.push({ id: uid('txn'), date: date||'', dow:'', category, payment, description:desc, amount, currency, uncertain:false });
  saveTrips();
  state.showAddForm = false;
  render();
}

    return `
    <div class="p-3 bg-[var(--bg)]">
      <div class="grid grid-cols-2 gap-2 mb-2">

        <select id="edit-currency-${t.id}" class="border border-[var(--line)] rounded-xl px-2 py-2 text-[13px]">
          <option value="LOCAL" ${t.currency!=='KRW'?'selected':''}>${escapeHtml(trip.currencyUnit)}</option>
          <option value="KRW" ${t.currency==='KRW'?'selected':''}>원</option>
        </select>
        <select id="edit-category-${t.id}" class="border border-[var(--line)] rounded-xl px-2 py-2 text-[13px]">

        </select>
        <select id="edit-payment-${t.id}" class="border border-[var(--line)] rounded-xl px-2 py-2 text-[13px]">

        </select>
        <input id="edit-date-${t.id}" type="date" value="${t.date||''}" class="border border-[var(--line)] rounded-xl px-3 py-2 text-[13px]" />
      </div>
      <div class="flex gap-2 justify-end">
        <button class="px-3 py-1.5 rounded-lg text-[12px] text-[var(--ink-2)] bg-white tap" onclick="cancelEdit()">취소</button>
        <button class="px-3 py-1.5 rounded-lg text-[12px] text-white bg-[var(--blue)] tap" onclick="saveEdit('${trip.id}','${t.id}')">저장</button>
      </div>
    </div>`;
  }
  return `
  <div class="flex items-center gap-3 p-3.5 group">
    <span class="w-2.5 h-2.5 rounded-full shrink-0" style="background:${meta.color}"></span>
    <div class="min-w-0 flex-1">
      <p class="text-[14px] font-medium truncate">${escapeHtml(t.description)}${t.uncertain ? ' <span class="text-[11px] text-[var(--red)]">(금액 확인필요)</span>' : ''}</p>
      <p class="text-[12px] text-[var(--ink-3)]">${meta.label} · ${t.payment}${t.currency==='KRW' ? ' · 원화결제' : ''}</p>
    </div>
    <p class="text-[14px] font-semibold whitespace-nowrap">${fmt(disp.value, disp.symbol)}</p>
    <div class="flex items-center opacity-60 group-hover:opacity-100">
      <button class="w-7 h-7 flex items-center justify-center text-[var(--ink-3)] hover:text-[var(--blue)]" onclick="startEdit('${t.id}')" title="수정">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M12 20h9M16.5 3.5a2.12 2.12 0 013 3L7 19l-4 1 1-4L16.5 3.5z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button class="w-7 h-7 flex items-center justify-center text-[var(--ink-3)] hover:text-[var(--red)]" onclick="deleteTxn('${trip.id}','${t.id}')" title="삭제">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M3 6h18M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2m3 0l-1 14a2 2 0 01-2 2H7a2 2 0 01-2-2L4 6h16z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>
  </div>`;
}

function startEdit(txnId){ state.editingTxnId = txnId; render(); }
function cancelEdit(){ state.editingTxnId = null; render(); }

function saveEdit(tripId, txnId){
  const trip = findTrip(tripId);
  const t = trip.transactions.find(x => x.id === txnId);
  if(!t) return;
  t.description = document.getElementById(`edit-desc-${txnId}`).value.trim() || t.description;
  const amt = parseInt(document.getElementById(`edit-amount-${txnId}`).value);
  if(!isNaN(amt)) t.amount = amt;
  t.currency = document.getElementById(`edit-currency-${txnId}`).value;
  t.category = document.getElementById(`edit-category-${txnId}`).value;
  t.payment = document.getElementById(`edit-payment-${txnId}`).value;
  t.date = document.getElementById(`edit-date-${txnId}`).value;
  t.uncertain = false;
  state.editingTxnId = null;
  saveTrips();
  render();
}

function deleteTxn(tripId, txnId){
  const trip = findTrip(tripId);
  trip.transactions = trip.transactions.filter(t => t.id !== txnId);
  saveTrips();
  render();
}

loadTrips();
render();
</script>
